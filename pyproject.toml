[project]
name = "go2-rocky-locomotion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "newton[examples]==1.6.0",
    "opensimplex>=0.4.5.1",
    "warp-lang==1.18.0",
]

[project.optional-dependencies]
train = [
    "torch==2.12.0",
    "rsl-rl-lib==5.5.1",
    "tensorboard>=2.20",
    "onnxscript>=0.5",
]
video = [
    "imageio[ffmpeg]>=2.37",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
