[project]
name = "newton-terrain"
version = "0.1.0"
description = "Unitree Go2 on sand and snow: two-way coupled MPM terrain in NVIDIA Warp / Newton, and a fast Warp terrain model for PPO training"
requires-python = ">=3.12"
dependencies = [
    "newton[examples]>=1.6.0",
    "rsl-rl-lib==5.5.1",
    "torch==2.12.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"
